name: Release desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: win
          - name: macOS
            os: macos-latest
            target: mac

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create desktop OAuth configuration
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI || 'http://localhost:3000/api/gmail/callback' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_REDIRECT_URI: ${{ vars.AZURE_REDIRECT_URI || 'http://localhost:3000/api/outlook/callback' }}
        run: |
          {
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_REDIRECT_URI=%s\n' "$GOOGLE_REDIRECT_URI"
            printf 'AZURE_CLIENT_ID=%s\n' "$AZURE_CLIENT_ID"
            printf 'AZURE_REDIRECT_URI=%s\n' "$AZURE_REDIRECT_URI"
          } > .env

      - name: Build unpacked Electron app
        run: npx electron-builder --${{ matrix.target }} dir --publish never

      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -czf "Unsubscribely-${{ github.ref_name }}-linux-x64.tar.gz" -C dist linux-unpacked

      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked -DestinationPath "Unsubscribely-${{ github.ref_name }}-windows-x64.zip"

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          MAC_DIR="$(find dist -maxdepth 1 -type d -name 'mac*' -print -quit)"
          if [ -z "$MAC_DIR" ]; then
            echo "No macOS unpacked build directory found"
            find dist -maxdepth 2 -print
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$MAC_DIR" \
            "Unsubscribely-${{ github.ref_name }}-macos.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: Unsubscribely-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unsubscribely $RELEASE_TAG" \
            --generate-notes
